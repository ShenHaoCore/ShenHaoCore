name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/snake/**"
      - "README.md"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ShenHaoCore
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake/github-contribution-grid-snake.svg
            assets/snake/github-contribution-grid-snake-dark.svg?palette=github-dark

      # README 通过相对路径 ./assets/snake/*.svg 引用（走 main + Camo），
      # 因此只需把产物提交回 main；原先额外推一份到 output 分支属于冗余，
      # 已移除（output 分支保留但不再更新）。
      - name: Commit snake assets to main
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update contribution snake [skip ci]"
          file_pattern: assets/snake/*.svg
