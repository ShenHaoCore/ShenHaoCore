name: README Link Check

# README 依赖大量第三方图床/CDN（图标、统计卡、打字横幅）。
# 这些服务一旦下线，主页会静默变成一片破图 —— 没有任何报错。
# 本工作流定期巡检 README 中的外部链接，失效时自动开 issue 提醒。
on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）
    - cron: "0 1 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check links in README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --accept 200..=299,429：第三方图床常对高频请求返回 429（限流），
          #   这属于“服务健在”而非失效，不应误报。
          # --max-retries / --retry-wait-time：抵御偶发网络抖动造成的假阳性。
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --accept 200..=299,429
            --verbose
            README.md
          fail: false

      - name: Open issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "README 存在失效链接（自动巡检）"
          content-filepath: ./lychee/out.md
          labels: |
            broken-link
            automated

      - name: Close resolved issue
        if: steps.lychee.outputs.exit_code == 0
        run: |
          # 巡检通过时，自动关闭此前由本工作流开出的失效 issue
          nums=$(gh issue list --label broken-link --state open --json number --jq '.[].number')
          for n in $nums; do
            gh issue close "$n" --comment "巡检通过，链接已全部恢复。自动关闭。"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
